name: reusable-report
on:
  workflow_call:
jobs:
  report:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@main
        with:
          name: report
          path: README.md
    permissions:
      contents: read
